name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # [Build] Build -> Test
  # ---------------------------------------------------------------------------
  build:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build -x test --stacktrace --info

      - name: Run developer tests
        run: ./gradlew developerTest --stacktrace --info

      - name: Run integration tests
        run: ./gradlew integrationTest --stacktrace --info

      - name: Create coverage report
        run: ./gradlew koverHtmlReport koverXmlReport --stacktrace

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/kover
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # [Verify] Licences — runs in parallel to the build and to the docs check
  # ---------------------------------------------------------------------------
  check-licences:
    name: Verify licences
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Check licences
        run: ./gradlew licensee --stacktrace --info

  # ---------------------------------------------------------------------------
  # [Verify] Build and verify MkDocs — runs in parallel to the build and to the
  # licence check. Building with `mkdocs --strict` acts as the verification: it
  # fails on broken links or missing pages. No deployment happens here, that is
  # exclusively part of the release pipeline.
  # ---------------------------------------------------------------------------
  validate-docs:
    name: Build and verify MkDocs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Pip Update
        run: pip install --upgrade pip

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build docs
        run: ./gradlew buildDocs --stacktrace --info
