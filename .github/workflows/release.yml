name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # [Changelog] Verify against version — runs first, everything else depends on
  # it. The extracted section is reused as the release notes.
  # ---------------------------------------------------------------------------
  changelog:
    name: Verify changelog
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.extract.outputs.notes }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog entry for the tag
        id: extract
        run: |
          TAG="${{ github.ref_name }}"
          NOTES=$(awk "/^## \[$TAG\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          NOTES=$(echo "$NOTES" | sed '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba}')
          if [ -z "$NOTES" ]; then
            echo "ERROR: No changelog entry found for tag $TAG"
            exit 1
          fi
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$NOTES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # [Build] Build -> Test
  # ---------------------------------------------------------------------------
  build:
    name: Build and test
    runs-on: ubuntu-latest
    needs: changelog

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build -x test --stacktrace

      - name: Run developer tests
        run: ./gradlew developerTest --stacktrace

      - name: Run integration tests
        run: ./gradlew integrationTest --stacktrace

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-jar
          path: apps/cli/build/libs/*.jar

  # ---------------------------------------------------------------------------
  # [Verify] Verify licences — parallel to build and MkDocs
  # ---------------------------------------------------------------------------
  licences:
    name: Verify licences
    runs-on: ubuntu-latest
    needs: changelog

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Check licences
        run: ./gradlew licensee --stacktrace

  # ---------------------------------------------------------------------------
  # [MkDocs] Build — `mkdocs --strict` verifies the docs before deployment
  # ---------------------------------------------------------------------------
  validate-docs:
    name: Build MkDocs
    runs-on: ubuntu-latest
    needs: changelog

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Pip Update
        run: pip install --upgrade pip

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build docs
        run: ./gradlew buildDocs --stacktrace --info

  # ---------------------------------------------------------------------------
  # [MkDocs] Deploy — publishes to gh-pages. A failing deployment must not fail
  # the release, it is only reported as a warning.
  # ---------------------------------------------------------------------------
  deploy-docs:
    name: Deploy MkDocs
    runs-on: ubuntu-latest
    needs: validate-docs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Pip Update
        run: pip install --upgrade pip

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Configure git for gh-deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy docs
        id: deploy
        continue-on-error: true
        run: ./gradlew deployDocs --stacktrace --info

      - name: Report deployment failure as warning
        if: steps.deploy.outcome == 'failure'
        run: echo "::warning title=Docs deployment failed::The documentation could not be deployed to gh-pages. The release continues."

  # ---------------------------------------------------------------------------
  # [Release] Push artifacts -> Write release. Runs last; a failed docs
  # deployment is tolerated (deploy-docs itself never fails).
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs:
      - changelog
      - build
      - licences
      - deploy-docs

    steps:
      - uses: actions/checkout@v4

      - name: Download CLI artifact
        uses: actions/download-artifact@v4
        with:
          name: cli-jar
          path: build/release/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ needs.changelog.outputs.notes }}
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" =~ ^(0|[a-zA-Z]) ]]; then
            gh release create "$TAG" build/release/*.jar \
              --title "$TAG" \
              --notes "$RELEASE_NOTES" \
              --prerelease \
              --latest=false
          else
            gh release create "$TAG" build/release/*.jar \
              --title "$TAG" \
              --notes "$RELEASE_NOTES" \
              --latest
          fi
